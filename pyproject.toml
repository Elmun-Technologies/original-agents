[project]
name = "poizon-uz"
version = "0.1.0"
description = "Poizon -> Uzbekistan original sneakers/apparel sales agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.13",
    "anthropic>=2.8.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs a Postgres server; set TEST_POSTGRES_URL (skipped otherwise)"]
