[project]
name = "poizon-uz"
version = "0.1.0"
description = "Poizon -> Uzbekistan original sneakers/apparel sales agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
