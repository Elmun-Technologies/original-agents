# weight_kg: actual weight incl. packaging (admin-provided starting values).
# package_cm: typical package L x W x H, used for volumetric weight.
# Chargeable weight = max(actual, volumetric).
# size_type: shoe (EU 30-50, .5 / 1/3 / 2/3) | apparel (XS..4XL or 24-60).
# label_uz / hashtag: shown in posts.
# min_price: cheaper than this (lowest size price) is rejected as a likely fake; the admin can
#   still add it ("➕ Baribir qoʻshish" / /allow). min_price_by_brand (brand name, word match,
#   case-insensitive) wins over the category value. /prices shows real prices to tune these.
# TODO(admin): all min_price values are first guesses — adjust after the first week (/prices).
# winter: true -> ships by air in pricing.avia_months.
# TODO(admin): package sizes except sneakers are estimates — measure real parcels.

sneakers:
  min_price: {CNY: 200, USD: 28}       # other brands
  min_price_by_brand:
    nike: &top_sneakers {CNY: 300, USD: 42}
    jordan: *top_sneakers
    adidas: *top_sneakers
    new balance: *top_sneakers
    asics: &mid_sneakers {CNY: 200, USD: 28}
    puma: *mid_sneakers
    converse: *mid_sneakers
    vans: *mid_sneakers
  label_uz: "Krossovka"
  hashtag: "#krossovka"
  weight_kg: 1.5
  size_type: shoe
  package_cm: [33, 22, 12]
  markup: 0.23
  winter: false

winter_boots:
  min_price: {CNY: 250, USD: 35}
  label_uz: "Qishki botinka"
  hashtag: "#qishkibotinka"
  weight_kg: 2.0
  size_type: shoe
  package_cm: [36, 26, 14]
  markup: 0.23
  winter: true

puffer:            # puxovik / qishki kurtka
  min_price: {CNY: 300, USD: 42}       # other brands
  min_price_by_brand:
    the north face: &top_puffer {CNY: 700, USD: 98}
    tnf: *top_puffer
    canada goose: *top_puffer
    moncler: *top_puffer
  label_uz: "Puxovik"
  hashtag: "#puxovik"
  weight_kg: 1.3
  size_type: apparel
  package_cm: [50, 40, 20]
  # TODO(admin): kargo/vositachi vakuum qadoqlashni tasdiqlashi kerak.
  # Per-order override: /neworder can mark "no vacuum" and the price is recalculated.
  vacuum_packing: true             # true -> use vacuum_package_cm instead
  vacuum_package_cm: [40, 30, 8]
  markup: 0.25
  winter: true

