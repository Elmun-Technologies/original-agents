# weight_kg: actual weight incl. packaging (admin-provided starting values).
# package_cm: typical package L x W x H, used for volumetric weight.
# Chargeable weight = max(actual, volumetric).
# winter: true -> ships by air in pricing.avia_months.
# TODO(admin): package sizes except sneakers are estimates — measure real parcels.

sneakers:
  weight_kg: 1.5
  package_cm: [33, 22, 12]
  markup: 0.23
  winter: false

winter_boots:
  weight_kg: 2.0
  package_cm: [36, 26, 14]
  markup: 0.23
  winter: true

puffer:            # puxovik / qishki kurtka
  weight_kg: 1.3
  package_cm: [50, 40, 20]
  vacuum_packing: false            # true -> use vacuum_package_cm instead
  vacuum_package_cm: [40, 30, 8]
  markup: 0.25
  winter: true

light_jacket:      # yengil kurtka / vetrovka
  weight_kg: 0.7
  package_cm: [35, 25, 8]
  markup: 0.25
  winter: false

hoodie:            # hudi / svitshot
  weight_kg: 0.7
  package_cm: [35, 25, 8]
  markup: 0.25
  winter: false

tshirt:
  weight_kg: 0.3
  package_cm: [30, 20, 4]
  markup: 0.25
  winter: false

pants:
  weight_kg: 0.6
  package_cm: [35, 25, 6]
  markup: 0.25
  winter: false
