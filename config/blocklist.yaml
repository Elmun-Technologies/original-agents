# Replica filter (CLAUDE.md §2 "Faqat original"). Any hit rejects the product;
# the matched word is written to products.rejected_reason.
#
# How terms match (case-insensitive, fullwidth chars normalized: "１：１" == "1:1"):
#  - Letters: match at the START of a word, so suffixes are caught:
#      "kopiya" matches "kopiyasi", "replik" matches "replikasi"/"replica".
#  - Spaces and hyphens inside a term are optional: "lux copy" == "lux-copy" == "luxcopy".
#  - Chinese: matched anywhere.
#  - Numbers: not glued to other digits ("1:1" does not match "11:15").
# False positives are OK (admin sees the reason); false negatives are not.

# Checked in every field of every source.
common:
  # Uzbek / translit
  - replik
  - replic
  - kopiya
  - kopya
  - feyk
  - bir ga bir
  # Russian
  - реплик
  - копия
  - копии
  - копию
  - копией
  - копий
  - фейк
  - один в один
  # 1:1
  - "1:1"
  - 1 в 1
  - 1 v 1
  - 1 to 1
  - 1 ga 1
  - 1 к 1
  # English
  - fake
  - lux copy
  - top copy
  - high copy
  - best copy
  - super copy
  - quality copy
  - mirror quality
  - mirror grade
  - aaa
  - unauthorized authentic
  - unauthorised authentic
  - pk batch
  - ljr batch
  - og batch
  - god batch
  # Chinese replica trade terms
  - 公司级
  - 纯原
  - 原单
  - 高仿
  - 莆田
  - 1比1
  - 一比一
  - a货
  - 超a
  - 尾单
  - 共享货源
  - 顶级版

# Checked everywhere EXCEPT official Poizon/Dewu text (product name + description of
# products whose origin is in official_sources). On Dewu "复刻" means an official retro release.
# Still rejected anywhere if any `common` term is also present (e.g. "复刻 1:1").
external_only:
  - 复刻

# Product origins (products.origin) whose name/description is Poizon/Dewu's own text.
# manual_sheet rows set it per row via the optional "origin" column (default: other).
official_sources:
  - dewu
  - poizon_com

# Replica supplier sites. Matched anywhere, including source_url.
domains:
  - gxhyapp.com

# Removed from the text before checking (legit words that contain a term).
exceptions:
  - copyright
  - копировальн

# "Oʻxshatma" (knock-off) check: a famous model name -> brands allowed to carry it.
# If the product name (brand + model + colour) contains the model but the brand is missing or
# not one of these, the product is rejected ("brendsiz oʻxshatma"). Matching: same rules as above.
famous_models:
  air force: [nike]
  air max: [nike]
  dunk: [nike]
  blazer: [nike]
  cortez: [nike]
  jordan: [jordan, air jordan, nike]
  yeezy: [adidas, yeezy]
  samba: [adidas]
  gazelle: [adidas]
  campus: [adidas]
  superstar: [adidas]
  spezial: [adidas]
  nuptse: [the north face, tnf]
  "327": [new balance, nb]
  "530": [new balance, nb]
  "550": [new balance, nb]
  "574": [new balance, nb]
  "990": [new balance, nb]
  "2002r": [new balance, nb]
  "1906r": [new balance, nb]
  "9060": [new balance, nb]
  gel-kayano: [asics]
  gel-1130: [asics]
  gel-nyc: [asics]
  chuck taylor: [converse]
  chuck 70: [converse]
  old skool: [vans]
  speedcat: [puma]
  palermo: [puma]
