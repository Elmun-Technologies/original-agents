# All business numbers live here. Code must not hard-code them.

# Safety switches (see CLAUDE.md §2, §6.2, §6.4)
poizon_tos_reviewed: false          # scraper refuses to run until admin sets true
sourcing_mode: manual_sheet         # manual_sheet | poizon_com
image_source_policy: own_photos_only  # own_photos_only | source_images

pricing:
  buyout_fee_pct: 0.05
  buyout_fee_min_usd: 3
  ship_rate_per_kg_usd:
    auto: 5.5
    avia: 9.2
  avia_months: [11, 12, 1]          # winter categories ship by air in these months
  local_delivery_usd: 2             # Tashkent
  volumetric_divisor: 6000          # cargo: L*W*H cm / divisor = volumetric kg
  usd_rate_buffer_pct: 0.015
  stale_rate_max_hours: 48          # CBU down: reuse last good rate up to this age
  stale_rate_extra_buffer_pct: 0.01 # ...with this extra buffer on top
  round_to_uzs: 10000
  quote_valid_hours: 24

customs:
  # TODO(admin): confirm all customs rules below with a customs broker.
  duty_free_limit_usd: 200          # per recipient (phone) per calendar month, Tashkent time
  customs_value_includes_shipping: false
  schedule:                         # picked by quote date; last entry with from <= date wins
    - {from: 2000-01-01, rate: 0.30, min_per_kg_usd: 3}
    - {from: 2027-01-01, rate: 0.20, min_per_kg_usd: 2}

sourcing:
  # Shoes are skipped if no AVAILABLE size falls in this EU range (by gender).
  popular_sizes_eu:
    men: [40, 45]
    women: [36, 40]
    unisex: [36, 45]

llm:
  # Model per task. Empty -> LLM_MODEL from .env (the default for everything else).
  models:
    content: claude-sonnet-5-5      # Opus only if admin switches it here
    sales:
    demand:
  daily_budget_usd: 5               # Tashkent day; when reached, new calls stop + admin alert
  max_tokens: 16000
  effort: medium                    # low | medium | high | xhigh | max
  refusal_fallback: true            # on a safety refusal, the API retries on a fallback model
  no_fallback_models: [claude-haiku-5-5]  # no server-side fallback on these
  # Purposes whose prompts may contain customer data: also checked against every customer
  # name/contact in the DB. Others get only format checks (phone, email, @username, address).
  customer_data_purposes: [sales]
  # USD per 1M tokens, for the budget and the daily AI expense row.
  # TODO(admin): update when Anthropic changes prices; LLM_MODEL must be listed here.
  prices_per_mtok:
    claude-opus-5-5:   {input: 4, output: 20, cache_write: 5, cache_read: 0.2}
    claude-sonnet-5-5: {input: 2, output: 10, cache_write: 2.5, cache_read: 0.1}
    claude-haiku-5-5:  {input: 0.1, output: 0.5, cache_write: 0.125, cache_read: 0.01}  # prompts <=100K tokens
    claude-opus-5:     {input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
    claude-opus-4-8:   {input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  # Our own public handles that may appear in prompts (not customer data), e.g. "@poizon_uz".
  pii_allowlist: []
