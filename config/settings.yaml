# All business numbers live here. Code must not hard-code them.

# Safety switches (see CLAUDE.md §2, §6.2, §6.4)
# Owner's decision 2026-11-14: products and images straight from poizon.com; the owner accepts
# the Poizon ToU 20.1 (o, p, r) risk. BUT poizon.com gives an honestly identified bot no product
# data (CLAUDE.md §6.2 "Texnik holat"), and getting it would mean posing as a browser, so
# poizon_client is not built and sourcing_mode=poizon_com is refused with that reason.
poizon_scraping_enabled: true
sourcing_mode: manual_sheet         # manual_sheet | poizon_com (not built, see above)
image_source_policy: source_images  # source_images (owner's decision, owner bears image-rights risk) | own_photos_only

# Automatic mode: posts that pass every check go to the channel without admin approval.
# Manual steps stay manual: payment confirmation and buying on Poizon/Dewu.
auto_publish: true
sheet_url: ""                       # manual_sheet CSV / Google Sheet export link, imported daily; empty = skip

schedule:                           # Asia/Tashkent
  import_time: "05:00"              # sheet import (the slow scraper slot if it ever exists)
  draft_time: "09:00"               # rank + price + images + drafts + auto check
  publish_times: ["12:00", "19:00", "21:00"]
  summary_time: "21:30"             # one daily message to the admin

images:                             # image_source_policy=source_images downloads
  max_bytes: 15000000
  pause_seconds: 1                  # between downloads
  timeout_seconds: 30

ranking:                            # "Solishtiruvchi": score = sum(weight * part), each part 0..1
  weights: {sold: 3, price: 2, sizes: 2, season: 1, trend: 3, has_images: 1}
  price_range_usd: [40, 250]        # source price that sells in our market
  sold_cap: 10000                   # sold counts above this score the same
  winter_months: [10, 11, 12, 1, 2] # winter categories rank up, others down

pricing:
  buyout_fee_pct: 0.05
  buyout_fee_min_usd: 3
  ship_rate_per_kg_usd:
    auto: 5.5
    avia: 9.2
  avia_months: [11, 12, 1]          # winter categories ship by air in these months
  local_delivery_usd: 2             # Tashkent
  volumetric_divisor: 6000          # cargo: L*W*H cm / divisor = volumetric kg
  usd_rate_buffer_pct: 0.015
  stale_rate_max_hours: 48          # CBU down: reuse last good rate up to this age
  stale_rate_extra_buffer_pct: 0.01 # ...with this extra buffer on top
  round_to_uzs: 10000
  quote_valid_hours: 24

customs:
  # TODO(admin): confirm all customs rules below with a customs broker.
  duty_free_limit_usd: 200          # per recipient (phone) per calendar month, Tashkent time
  customs_value_includes_shipping: false
  schedule:                         # picked by quote date; last entry with from <= date wins
    - {from: 2000-01-01, rate: 0.30, min_per_kg_usd: 3}
    - {from: 2027-01-01, rate: 0.20, min_per_kg_usd: 2}

sourcing:
  # Shoes are skipped if no AVAILABLE size falls in this EU range (by gender).
  popular_sizes_eu:
    men: [40, 45]
    women: [36, 40]
    unisex: [36, 45]

llm:
  # Model per task. Empty -> LLM_MODEL from .env (the default for everything else).
  models:
    content: claude-sonnet-5-5      # Opus only if admin switches it here
    sales:
    demand:
  daily_budget_usd: 5               # Tashkent day; when reached, new calls stop + admin alert
  max_tokens: 16000
  effort: medium                    # low | medium | high | xhigh | max
  refusal_fallback: true            # on a safety refusal, the API retries on a fallback model
  no_fallback_models: [claude-haiku-5-5]  # no server-side fallback on these
  # Purposes whose prompts may contain customer data: also checked against every customer
  # name/contact in the DB. Others get only format checks (phone, email, @username, address).
  customer_data_purposes: [sales]
  # USD per 1M tokens, for the budget and the daily AI expense row.
  # TODO(admin): update when Anthropic changes prices; LLM_MODEL must be listed here.
  prices_per_mtok:
    claude-opus-5-5:   {input: 4, output: 20, cache_write: 5, cache_read: 0.2}
    claude-sonnet-5-5: {input: 2, output: 10, cache_write: 2.5, cache_read: 0.1}
    claude-haiku-5-5:  {input: 0.1, output: 0.5, cache_write: 0.125, cache_read: 0.01}  # prompts <=100K tokens
    claude-opus-5:     {input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
    claude-opus-4-8:   {input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  # Our own public handles that may appear in prompts (not customer data), e.g. "@poizon_uz".
  pii_allowlist: []

content:
  badge: "Original · Poizon tekshiruvi"
  delivery_days: {auto: "20–30", avia: "7–12"}   # shown in posts, by shipping mode
  cta: "Buyurtma uchun Instagram DM yoki Telegram botimizga yozing."
  hashtags: ["#original", "#poizon", "#toshkent", "#uzbekistan"]   # + category + brand, max 8
  max_body_chars: 450               # LLM-written part
  llm_retries: 2                    # rejected LLM text (English, notes, filters) -> ask again
  caption_max_chars: 1024           # Telegram photo caption limit
  photos_dir: data/photos           # own photos: data/photos/<style_code>/*.jpg|png|webp
  cards_max: 5

stock:
  markup: 0.30                      # stock in Tashkent, delivered at once -> priced higher
  delivery_text: "Mavjud · 1 kunda yetkazamiz"

publishing:
  daily_drafts: {min: 5, max: 8}
  price_change_alert_pct: 0.05      # recheck before approve/publish
  max_price_age_days: 3             # source price older than this is not published (re-send screenshots)
  per_brand_daily_max: 2            # drafts per day, keeps the channel varied
  per_model_daily_max: 1
  stock_repost_after_days: 14       # stock items may be posted again after this
  trend_days: 30                    # /trend notes older than this are ignored
  photos_max_per_sku: 10
